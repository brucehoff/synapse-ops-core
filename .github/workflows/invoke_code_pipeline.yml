---
name: Invoke Code Pipeline

on:
  workflow_call:
    inputs:
      PIPELINE_PARAMETERS:
        required: true
        type: string
        description: Comma separated list of Name=Value pairs to pass to Code Pipeline CF template
      SECOND_REPO_OWNER:
        required: false
        type: string
        default: Sage-Bionetworks
        description: Owner of optional second repository to use in build
      SECOND_REPO_NAME:
        required: false
        type: string
        description: Name of optional second repository to use in build
      SECOND_REPO_BRANCH:
        required: false
        type: string
        default: develop
        description: Branch of optional second repository to use in build
      BUILD_IMAGE:
        required: false
        type: string
        default: aws/codebuild/amazonlinux-x86_64-standard:5.0
        description: The CodeBuild image to use when executing the pipeline
      BUILD_ENVIRONMENT_TYPE:
        required: false
        type: string
        default: LINUX_CONTAINER
        description: CodeBuild environment type (e.g., LINUX_CONTAINER or ARM_CONTAINER)

env:
   # Note synapse-ops-core is both the repository for the code-pipeline CloudFormation definition
   # and also the repository for the various 'ops' scripts.  So we define the following once and
   # use them both for setting up the pipeline and for running the scripts.
   REPOSITORY_OWNER: Sage-Bionetworks
   REPOSITORY_NAME: synapse-ops-core
   REPOSITORY_BRANCH: main

jobs:
  upload_source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Ops Repo
        uses: actions/checkout@v5
        with:
          repository: ${{ env.REPOSITORY_OWNER }}/${{ env.REPOSITORY_NAME }}
          ref: ${{ env.REPOSITORY_BRANCH }}

      - name: Checkout Second Repo
        if: ${{ inputs.SECOND_REPO_NAME != '' }}
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.SECOND_REPO_OWNER }}/${{ inputs.SECOND_REPO_NAME }}
          ref: ${{ inputs.SECOND_REPO_BRANCH }}
          path: second-repo

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Upload Sources to S3
        id: upload
        run: |
          STACK="${{ vars.CONTEXT }}"
          BUCKET="${STACK}-synapse-ops-build-source"

          # Ensure bucket exists with versioning and lifecycle policy
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --region us-east-1
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-lifecycle-configuration --bucket "$BUCKET" \
              --lifecycle-configuration '{"Rules":[{"ID":"PurgeOldUploads","Status":"Enabled","Expiration":{"Days":7},"Filter":{"Prefix":""}}]}'
          fi

          # Resolve ops repo commit SHA
          OPS_SHA=$(git rev-parse HEAD)

          OPS_KEY="${{ env.REPOSITORY_OWNER }}/${{ env.REPOSITORY_NAME }}/${OPS_SHA}/${{ env.REPOSITORY_NAME }}.zip"

          # Zip and upload ops repo
          zip -qr /tmp/ops.zip . -x '.git/*' 'second-repo/*'
          aws s3 cp /tmp/ops.zip "s3://${BUCKET}/${OPS_KEY}"

          echo "SOURCE_BUCKET=$BUCKET" >> $GITHUB_OUTPUT
          echo "OPS_SOURCE_KEY=$OPS_KEY" >> $GITHUB_OUTPUT

          # Upload second repo if present
          if [[ "${{ inputs.SECOND_REPO_NAME }}" ]]; then
            SECOND_REPO_SHA=$(git -C second-repo rev-parse HEAD)
            SECOND_REPO_KEY="${{ inputs.SECOND_REPO_OWNER }}/${{ inputs.SECOND_REPO_NAME }}/${SECOND_REPO_SHA}/${{ inputs.SECOND_REPO_NAME }}.zip"
            cd second-repo
            zip -qr /tmp/second-repo.zip . -x '.git/*'
            aws s3 cp /tmp/second-repo.zip "s3://${BUCKET}/${SECOND_REPO_KEY}"
            echo "SECOND_REPO_SOURCE_KEY=$SECOND_REPO_KEY" >> $GITHUB_OUTPUT
          fi

    outputs:
      SOURCE_BUCKET: ${{ steps.upload.outputs.SOURCE_BUCKET }}
      OPS_SOURCE_KEY: ${{ steps.upload.outputs.OPS_SOURCE_KEY }}
      SECOND_REPO_SOURCE_KEY: ${{ steps.upload.outputs.SECOND_REPO_SOURCE_KEY }}

  set-up:
    needs: upload_source
    runs-on: ubuntu-latest
    steps:
      - name: Determine Pipeline Parameters
        id: pipeline-params
        run: |
          PIPELINE_PARAMETERS=\
          ${{ inputs.PIPELINE_PARAMETERS }},\
          SourceBucket=${{ needs.upload_source.outputs.SOURCE_BUCKET }},\
          OpsSourceKey=${{ needs.upload_source.outputs.OPS_SOURCE_KEY }},\
          VpcId=${{ vars.VPC_ID }},\
          Subnets=${{ vars.SUBNETS }},\
          SecurityGroupIds=${{ vars.SECURITY_GROUP_IDS }},\
          BuildImage=${{ inputs.BUILD_IMAGE }},\
          BuildEnvironmentType=${{ inputs.BUILD_ENVIRONMENT_TYPE }}

          # There will be one pipeline for running jobs based on the Stack Builder
          # and one pipeline for running short lived commands.
          if [[ "${{ inputs.SECOND_REPO_NAME }}" ]]; then
            echo "CODE_PIPELINE_NAME=Deployment-Pipeline" >> $GITHUB_OUTPUT
            echo "PATH_TO_PIPELINE=configuration/build/codepipeline_with_second_repo_template.yaml" >> $GITHUB_OUTPUT
            PIPELINE_PARAMETERS=${PIPELINE_PARAMETERS},SecondRepoSourceKey=${{ needs.upload_source.outputs.SECOND_REPO_SOURCE_KEY }}
          else
            echo "CODE_PIPELINE_NAME=Shared-Pipeline" >> $GITHUB_OUTPUT
            echo "PATH_TO_PIPELINE=configuration/build/codepipeline_template.yaml" >> $GITHUB_OUTPUT
          fi

          echo "PIPELINE_PARAMETERS=$PIPELINE_PARAMETERS" >> $GITHUB_OUTPUT

    outputs:
      CODE_PIPELINE_NAME: ${{ steps.pipeline-params.outputs.CODE_PIPELINE_NAME }}
      PIPELINE_PARAMETERS: ${{ steps.pipeline-params.outputs.PIPELINE_PARAMETERS }}
      PATH_TO_PIPELINE: ${{ steps.pipeline-params.outputs.PATH_TO_PIPELINE }}
      REPO_OWNER_AND_NAME: ${{ env.REPOSITORY_OWNER }}/${{ env.REPOSITORY_NAME }}
      REPOSITORY_BRANCH: ${{ env.REPOSITORY_BRANCH }}

  invoke_workflow:
    needs: set-up
    uses: Sage-Bionetworks/Synapse-Code-Pipeline/.github/workflows/execute_code_pipeline_v2.yml@main
    with:
      # Note the following specifies the repo' that contains the code pipeline definition
      REPOSITORY_NAME: ${{ needs.set-up.outputs.REPO_OWNER_AND_NAME }}
      REPOSITORY_BRANCH: ${{ needs.set-up.outputs.REPOSITORY_BRANCH }}
      CODE_PIPELINE_CF_TEMPLATE: ${{ needs.set-up.outputs.PATH_TO_PIPELINE }}
      PIPELINE_NAME: ${{ needs.set-up.outputs.CODE_PIPELINE_NAME }}
      PIPELINE_PARAMETERS: ${{ needs.set-up.outputs.PIPELINE_PARAMETERS }}
      ROLE_TO_ASSUME: ${{ vars.ROLE_TO_ASSUME }}
    secrets: inherit
    permissions:
      # https://graphite.dev/guides/github-actions-permissions
      id-token: write
      contents: read
      deployments: write
      security-events: write
      statuses: write
      actions: write
      checks: write
...
